name: Publish

on:
  push:
    tags: [ "v*" ]

permissions:
  id-token: write
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - name: Ensure npm 11.5.1+ for trusted publishing
      run: npm install -g npm@11
    - run: npm ci
    - run: npm test
    - run: npm publish
